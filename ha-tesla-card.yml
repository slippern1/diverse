  - type: custom:button-card
    entity: device_tracker.tessie_location_tracker
    show_icon: false
    show_name: false
    show_state: true
    state_display: |
      [[[
        const state = entity.state.toLowerCase();
        return state === "home"
          ? "Hjemme"
          : state === "not_home"
            ? "Borte"
            : entity.state;
      ]]]
    tap_action: none
    double_tap_action: none
