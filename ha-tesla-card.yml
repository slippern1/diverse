  - type: custom:button-card
    entity: sensor.tessie_battery
    show_icon: false
    show_name: false
    show_state: true
    styles:
      card:
        - width: 270px
        - height: 24px
        - padding: 0
        - background: |
            [[[
              const rawLevel = Number(entity.state);
              const level = Number.isFinite(rawLevel)
                ? Math.min(100, Math.max(0, rawLevel))
                : 0;
              let color = '#4caf50';

              if (level <= 10)
                color = '#f44336';
              else if (level <= 20)
                color = '#ff9800';

              return `linear-gradient(
                90deg,
                ${color} 0%,
                ${color} ${level}%,
                rgba(100,100,100,0.2) ${level}%,
                rgba(100,100,100,0.2) 100%
              )`;
            ]]]
        - border-radius: 12px
        - border: 1px solid rgba(80,80,80,0.6)
      state:
        - justify-self: center
        - align-self: center
        - color: white
        - font-size: 14px
        - font-weight: bold
        - text-shadow: 0 1px 2px rgba(0,0,0,0.8)
    state_display: |
      [[[
        const level = Number(entity.state);
        return Number.isFinite(level) ? `${level}%` : entity.state;
      ]]]
    style:
      top: 85%
      left: 53%
