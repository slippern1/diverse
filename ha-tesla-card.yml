      top: 6.5%
      left: 10%
      color: '#039be5'
    tap_action:
      action: call-service
      service: button.press
      service_data: {}
      target:
        entity_id: button.tessie_force_data_update
    double_tap_action: none
    hold_action: none
  - type: state-label
    entity: button.tessie_force_data_update
    tap_action:
      action: call-service
      service: button.press
      service_data: {}
