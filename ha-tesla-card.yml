        style:
          top: 84.7%
          left: 55%
          color: green
  - type: conditional
    conditions:
      - entity: binary_sensor.tessie_ischarging
        state: 'on'
      - entity: device_tracker.tessie_location_tracker
        state_not: home
    elements:
      - type: icon
        icon: mdi:ev-station
        tap_action: none
        double_tap_action: none
        hold_action: none
        style:
          top: 84.7%
          left: 55%
          color: green
  - type: custom:button-card
    entity: sensor.tessie_battery
    show_icon: false
    show_name: false
    show_state: true
    styles: null
    card:
      - width: 270px
      - height: 24px
      - padding: 0px
      - background: |
          [[[ 
            const level = entity.state;
            let color = '#4caf50';

            if (level <= 10)
              color = '#f44336';
            else if (level <= 20)
              color = '#ff9800';

            return `linear-gradient(
              90deg,
              ${color} 0%,
              ${color} ${level}%,
              rgba(255,255,255,0.15) ${level}%,
              rgba(255,255,255,0.15) 100%
            )`;
          ]]]
      - border-radius: 12px
      - border: 1px solid rgba(255,255,255,0.3)
      - color: black
      - font-size: 14px
      - font-weight: bold
    state_display: |
      [[[ return entity.state + '%'; ]]]
    style:
      top: 85%
      left: 53%
